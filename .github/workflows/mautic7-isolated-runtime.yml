name: Empire Mautic 7 isolated runtime contract
on:
  push:
    branches: [integration/mautic-crm-active-20261119]
    paths:
      - .github/workflows/mautic7-isolated-runtime.yml
      - tests/mautic_sandbox/**
      - empire_os/mautic_webhook_review.py
permissions:
  contents: read
concurrency:
  group: empire-mautic7-isolated-contract
  cancel-in-progress: true
jobs:
  isolated-mautic:
    name: Verify official Mautic 7 on isolated Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAUTIC_CONTRACT_HTTP_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic secrets and validate isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in MAUTIC_CONTRACT_DB_PASSWORD MAUTIC_CONTRACT_DB_ROOT_PASSWORD MAUTIC_CONTRACT_ADMIN_PASSWORD MAUTIC_CONTRACT_WEBHOOK_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          python3 scripts/preflight_mautic_contract_sandbox.py
          echo "DISPOSABLE_DOCKER_RUNTIME_AVAILABLE"
      - name: Start Mautic and MySQL and install synthetic application
        shell: bash
        run: |
          set -Eeuo pipefail
          dc() { docker compose --profile mautic-contract-only -f tests/mautic_sandbox/compose.yaml -f tests/mautic_sandbox/compose.delivery.yaml "$@"; }
          dc up -d --pull always --no-build db mautic_web receiver
          dc ps
          for n in $(seq 1 45); do
            if dc exec -T db mysqladmin ping -h127.0.0.1 --silent >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ready=0
          for n in $(seq 1 90); do
            if dc exec -T -w /var/www/html mautic_web sh -c 'test -f bin/console' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "MAUTIC_CLI_MISSING_AFTER_START"; exit 1; }
          dc exec -T -w /var/www/html mautic_web php bin/console --version
          dc exec -T -w /var/www/html mautic_web php bin/console mautic:install --help | head -100
          dc exec -T -u www-data -w /var/www/html mautic_web \
            php bin/console mautic:install "http://localhost:18080" \
            --db_host=db --db_port=3306 --db_name=mautic_contract_test \
            --db_user=mautic_contract_test --db_password="$MAUTIC_CONTRACT_DB_PASSWORD" \
            --admin_email="synthetic-admin@example.invalid" \
            --admin_password="$MAUTIC_CONTRACT_ADMIN_PASSWORD" --force --no-interaction
          tables="$(dc exec -T -e MYSQL_PWD="$MAUTIC_CONTRACT_DB_PASSWORD" db             mysql -umautic_contract_test -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='mautic_contract_test'")"
          echo "MAUTIC_INSTALL_CREATED_TABLES=$tables"
          test "$tables" -ge 50 || { echo "MAUTIC_APPLICATION_INSTALL_INCOMPLETE"; exit 1; }
          ready=0
          for n in $(seq 1 45); do
            code="$(dc exec -T mautic_web curl -sS -o /dev/null               --max-time 4 -w '%{http_code}' http://127.0.0.1/ 2>/dev/null || true)"
            if [[ "$code" == 200 || "$code" == 302 || "$code" == 303 ]]; then
              echo "MAUTIC_PRIVATE_APP_HTTP_VERIFIED_$code"
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "PRIVATE_MAUTIC_APPLICATION_NOT_READY"; exit 1; }
          dc exec -T -w /var/www/html mautic_web             php bin/console mautic:webhooks:process --help >/dev/null
          echo "FULL_MAUTIC_7_APP_INSTALLED_AND_WEBHOOK_QUEUE_COMMAND_EXISTS"
      - name: Deliver native Mautic queue to the real EmpireOS signature adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          dc() { docker compose --profile mautic-contract-only -f tests/mautic_sandbox/compose.yaml -f tests/mautic_sandbox/compose.delivery.yaml "$@"; }
          for n in $(seq 1 25); do
            if dc exec -T receiver python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=3)' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          dc exec -T receiver python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=4).status == 200'
          dc cp tests/mautic_sandbox/seed_native_queue.php mautic_web:/tmp/seed_native_queue.php
          dc exec -T mautic_web php -l /tmp/seed_native_queue.php
          seed="$(dc exec -T -u www-data -w /var/www/html             -e MAUTIC_CONTRACT_ONLY=1             -e MAUTIC_CONTRACT_WEBHOOK_SECRET="$MAUTIC_CONTRACT_WEBHOOK_SECRET"             mautic_web php /tmp/seed_native_queue.php)"
          webhook_id="$(printf '%s\n' "$seed" | sed -n 's/^CI_WEBHOOK_ID=//p' | tail -1)"
          [[ "$webhook_id" =~ ^[0-9]+$ ]] || { echo "NATIVE_MAUTIC_QUEUE_SEED_FAILED"; exit 1; }
          echo "MAUTIC_7_NATIVE_WEBHOOK_AND_QUEUE_CREATED"
          dc exec -T -u www-data -w /var/www/html mautic_web             php bin/console mautic:webhooks:process --webhook-id="$webhook_id" --no-interaction
          dc exec -T receiver cat /tmp/mautic_native_queue_receipt.json |             python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["signed_webhook_verified"] is True and r["producer"]=="native_mautic_7_queue" and r["signal"]=="SUPPRESSION_REVIEW_REQUIRED" and r["send_authorized"] is False and r["canonical_crm_written"] is False; print("NATIVE_MAUTIC_SIGNED_WEBHOOK_ARRIVED_IN_EMPIREOS_ADAPTER")'
          remaining="$(dc exec -T -e MYSQL_PWD="$MAUTIC_CONTRACT_DB_PASSWORD" db             mysql -umautic_contract_test -D mautic_contract_test -N             -e "SELECT COUNT(*) FROM webhook_queue WHERE webhook_id=$webhook_id")"
          test "$remaining" = 0 || { echo "MAUTIC_QUEUE_NOT_ACKNOWLEDGED"; exit 1; }
          echo "NATIVE_MAUTIC_QUEUE_ACKNOWLEDGED_AND_DELETED_NO_SENDING"
      - name: Print isolated diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose --profile mautic-contract-only -f tests/mautic_sandbox/compose.yaml -f tests/mautic_sandbox/compose.delivery.yaml ps || true
          docker compose --profile mautic-contract-only -f tests/mautic_sandbox/compose.yaml -f tests/mautic_sandbox/compose.delivery.yaml logs --tail 45 mautic_web db receiver || true
      - name: Remove isolated containers and synthetic database
        if: always()
        shell: bash
        run: |
          docker compose --profile mautic-contract-only -f tests/mautic_sandbox/compose.yaml -f tests/mautic_sandbox/compose.delivery.yaml \
            down -v --remove-orphans --timeout 10 || true
