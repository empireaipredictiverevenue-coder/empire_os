name: Empire Mail candidate verification

on:
  push:
    branches:
      - feature/empire-mail-v1
  pull_request:
    branches:
      - feature/revenue-intelligence-v2

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Empire Mail backend
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_empire_mailbox.py             tests/test_founder_mailbox_api.py             tests/test_reply_classifier.py             tests/test_resend_webhook_app.py             tests/test_buyer_reply_operations_agent.py             --tb=short
      - name: Compile mailbox modules
        run: |
          python -m py_compile             empire_os/empire_mailbox.py             empire_os/founder_mailbox_api.py             empire_os/reply_classifier.py             empire_os/founder_dashboard_service.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/search-command-centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/search-command-centre/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
