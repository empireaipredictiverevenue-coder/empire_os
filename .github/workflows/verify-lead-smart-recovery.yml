name: Verify Lead Smart recovery

on:
  push:
    branches:
      - recovery/lead-smart-pilot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Prepare CI env path
        run: |
          sudo mkdir -p /root/empire_os
          sudo touch /root/empire_os/.env
          sudo chmod 755 /root /root/empire_os
          sudo chmod 644 /root/empire_os/.env
      - name: Verify recovered policy and assets
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_buyer_supply_policy.py \
            tests/test_buyer_pilot_assets.py \
            --tb=short
      - name: Compile
        run: |
          python -m py_compile \
            empire_os/buyer_supply_policy.py \
            empire_os/buyer_pilot_assets.py
