name: outbound-deliverability

on:
  pull_request:
    paths:
      - "empire_os/outbound_*.py"
      - "empire_os/google_postmaster_v2.py"
      - "empire_os/founder_outbound_deliverability_api.py"
      - "empire_os/founder_dashboard_service.py"
      - "empire_os/funnel.py"
      - "migrations/empiredb/033_outbound_deliverability_control_plane.sql"
      - "tests/test_outbound_*.py"
      - "tests/test_empiredb_outbound_deliverability_migration.py"
      - "tests/test_founder_outbound_deliverability_api.py"
      - "tests/test_google_postmaster_v2.py"
      - "docs/outbound_*.md"
      - "docs/empire_native_deliverability_stack.md"
      - ".github/workflows/outbound-deliverability.yml"
  push:
    branches:
      - "agent/outbound-deliverability-v1"
    paths:
      - "empire_os/outbound_*.py"
      - "empire_os/google_postmaster_v2.py"
      - "empire_os/founder_outbound_deliverability_api.py"
      - "empire_os/founder_dashboard_service.py"
      - "empire_os/funnel.py"
      - "migrations/empiredb/033_outbound_deliverability_control_plane.sql"
      - "tests/test_outbound_*.py"
      - "tests/test_empiredb_outbound_deliverability_migration.py"
      - "tests/test_founder_outbound_deliverability_api.py"
      - ".github/workflows/outbound-deliverability.yml"

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile deliverability subsystem
        run: |
          python -m compileall -q \
            empire_os/outbound_deliverability.py \
            empire_os/outbound_deliverability_provider.py \
            empire_os/outbound_deliverability_ringleader.py \
            empire_os/outbound_deliverability_service.py \
            empire_os/outbound_deliverability_snapshot.py \
            empire_os/outbound_deliverability_twin.py \
            empire_os/outbound_domain_sovereignty.py \
            empire_os/outbound_domain_continuity.py \
            empire_os/outbound_warmup.py \
            empire_os/outbound_mx_pacing.py \
            empire_os/outbound_reputation_budget.py \
            empire_os/outbound_reputation_economic_memory.py \
            empire_os/outbound_reputation_escrow.py \
            empire_os/outbound_reputation_slo.py \
            empire_os/outbound_reputation_graph.py \
            empire_os/outbound_root_cause.py \
            empire_os/outbound_remediation_planner.py \
            empire_os/outbound_send_compiler.py \
            empire_os/outbound_transport_benchmark.py \
            empire_os/outbound_provider_policy_registry.py \
            empire_os/outbound_verification_depth.py \
            empire_os/outbound_canary.py \
            empire_os/outbound_commercial_feedback.py \
            empire_os/outbound_contact_pressure.py \
            empire_os/outbound_sender_affinity.py \
            empire_os/outbound_health_forecast.py \
            empire_os/outbound_evidence_chain.py \
            empire_os/outbound_evidence_normalizer.py \
            empire_os/outbound_failover_drill.py \
            empire_os/outbound_founder_alerts.py \
            empire_os/outbound_postgres_repository.py \
            empire_os/outbound_state_replay.py \
            empire_os/outbound_ringleader_runtime.py \
            empire_os/outbound_mx_family.py \
            empire_os/microsoft_outlook_evidence.py \
            empire_os/outbound_destination_reputation.py \
            empire_os/outbound_yahoo_evidence.py \
            empire_os/outbound_apple_evidence.py \
            empire_os/outbound_arf_report.py \
            empire_os/outbound_recipient_domain_policy.py \
            empire_os/outbound_policy_shadow.py \
            empire_os/outbound_counterfactual_replay.py \
            empire_os/outbound_config_attestation.py \
            empire_os/outbound_infrastructure_concentration.py \
            empire_os/google_postmaster_v2.py \
            empire_os/founder_outbound_deliverability_api.py \
            empire_os/funnel.py

      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_outbound_deliverability.py \
            tests/test_outbound_deliverability_snapshot.py \
            tests/test_outbound_deliverability_service.py \
            tests/test_outbound_deliverability_ringleader.py \
            tests/test_outbound_advanced_deliverability.py \
            tests/test_outbound_deliverability_moat.py \
            tests/test_outbound_reputation_controls.py \
            tests/test_outbound_reputation_memory.py \
            tests/test_outbound_send_compiler.py \
            tests/test_outbound_warmup.py \
            tests/test_outbound_contact_controls.py \
            tests/test_outbound_domain_continuity.py \
            tests/test_outbound_health_forecast.py \
            tests/test_outbound_evidence_chain.py \
            tests/test_outbound_evidence_ops.py \
            tests/test_outbound_postgres_repository.py \
            tests/test_outbound_ringleader_runtime.py \
            tests/test_empiredb_outbound_deliverability_migration.py \
            tests/test_founder_outbound_deliverability_api.py \
            tests/test_google_postmaster_v2.py \
            tests/test_outbound_destination_intelligence.py \
            tests/test_outbound_destination_reputation.py \
            tests/test_outbound_destination_extended.py \
            tests/test_outbound_arf_report.py \
            tests/test_outbound_policy_engineering.py \
            tests/test_outbound_counterfactual_replay.py \
            tests/test_outbound_governor.py
