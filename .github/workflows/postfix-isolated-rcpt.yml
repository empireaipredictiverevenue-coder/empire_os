name: Sovereign mail - isolated Postfix RCPT proof

on:
  push:
    branches:
      - feature/postfix-isolated-rcpt-ci-20261014

permissions:
  contents: read

jobs:
  disposable-postfix-rcpt:
    if: github.repository == 'empireaipredictiverevenue-coder/empire_os'
    name: Real Postfix RCPT-only (3.8 host + 3.10 container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch only allowlisted staging files from exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "empireaipredictiverevenue-coder/empire_os"
          git init -q
          git remote add origin https://github.com/empireaipredictiverevenue-coder/empire_os.git
          git -c protocol.version=2 fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD --             empire_os/owned_postfix_staging_profile.py             scripts/probe_postfix_staging_smtp_rcpt.py             scripts/ci_postfix_rcpt_acceptance.sh             scripts/probe_postfix_synthetic_delivery.py             deploy/mail/postfix_staging/Dockerfile             deploy/mail/postfix_staging/container-entrypoint.sh             deploy/mail/postfix_staging/run_isolated_acceptance.sh
          test -f deploy/mail/postfix_staging/Dockerfile
          echo "ONLY_BOUNDED_TEST_FILES_FETCHED=TRUE"
      - name: Postfix 3.8 real host SMTP admission
        shell: bash
        run: bash scripts/ci_postfix_rcpt_acceptance.sh
      - name: Postfix 3.10 real isolated container SMTP admission
        shell: bash
        run: bash deploy/mail/postfix_staging/run_isolated_acceptance.sh --approved-isolated-container-only
