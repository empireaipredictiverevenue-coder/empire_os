name: Verify Founder Console deploy helper

on:
  push:
    branches:
      - feature/founder-console-safe-deploy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/deploy_founder_console.sh
      - name: Safety contract
        run: |
          grep -F 'git merge --ff-only "origin/$BRANCH"' scripts/deploy_founder_console.sh
          grep -F 'git status --short --untracked-files=no' scripts/deploy_founder_console.sh
          grep -F 'npm run build' scripts/deploy_founder_console.sh
          grep -F 'tests/test_empire_mailbox.py' scripts/deploy_founder_console.sh
          grep -F 'systemctl restart "$API_UNIT"' scripts/deploy_founder_console.sh
          grep -F 'systemctl restart "$CONSOLE_UNIT"' scripts/deploy_founder_console.sh
          grep -F '127.0.0.1:8766/v1/founder-mailbox/summary' scripts/deploy_founder_console.sh
          grep -F '127.0.0.1:3001/founder/mail' scripts/deploy_founder_console.sh
