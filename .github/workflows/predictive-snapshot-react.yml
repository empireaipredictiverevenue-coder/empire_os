name: Predictive snapshot and React
on:
  pull_request:
    paths:
      - 'empire_os/predictive_revenue_demo*.py'
      - 'empire_os/predictive_cloud_*.py'
      - 'tests/test_predictive_revenue_snapshot_bridge.py'
      - 'tests/test_predictive_revenue_demo.py'
      - 'tests/test_predictive_cloud_*.py'
      - 'apps/search-command-centre/**'
      - 'pyproject.toml'
      - '.github/workflows/predictive-snapshot-react.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-react-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact test commit without initializing unrelated submodules
        env:
          REVIEW_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${REVIEW_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$REVIEW_SHA"
          unset auth REVIEW_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          if git config --local --get-regexp 'extraheader|credential'; then exit 1; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install backend test dependencies
        run: python -m pip install -e '.[dev,payment-ops]'
      - name: Original API contract and protected Cloud regressions (fixtures only)
        env:
          PYTHONPATH: '.'
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_predictive_revenue_snapshot_bridge.py
          tests/test_predictive_revenue_demo.py
          tests/test_predictive_cloud_core_jev_observer_20261025.py
          tests/test_predictive_cloud_materializer.py
          tests/test_predictive_cloud_original_source_admission_20261025.py
      - name: Install locked React dependencies
        working-directory: apps/search-command-centre
        run: npm ci --no-audit --no-fund
      - name: Render snapshot holds and financial unknowns
        working-directory: apps/search-command-centre
        run: node --test tests/predictive-money.test.cjs tests/predictive-snapshot-panel.test.cjs tests/predictive-company-client.test.cjs
      - name: Lint changed Predictive Revenue components
        working-directory: apps/search-command-centre
        run: npx --no-install eslint src/app/predictive-revenue/page.tsx src/app/predictive-revenue/money.ts src/app/predictive-revenue/snapshot-evidence.tsx
      - name: Build existing command centre
        working-directory: apps/search-command-centre
        run: npx --no-install next build --webpack
      - name: Check TypeScript including generated route types
        working-directory: apps/search-command-centre
        run: npx --no-install tsc --noEmit --incremental false
