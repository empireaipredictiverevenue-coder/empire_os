name: Probe Empire Deploy Secret Presence

on:
  push:
    branches:
      - probe/empire-public-control-bootstrap

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      S1: ${{ secrets.SSH_PRIVATE_KEY }}
      S2: ${{ secrets.SSH_KEY }}
      S3: ${{ secrets.DEPLOY_SSH_KEY }}
      S4: ${{ secrets.EMPIRE_SSH_PRIVATE_KEY }}
      S5: ${{ secrets.SERVER_SSH_KEY }}
      S6: ${{ secrets.SCALEWAY_SSH_KEY }}
      H1: ${{ secrets.SERVER_HOST }}
      H2: ${{ secrets.SSH_HOST }}
      H3: ${{ secrets.DEPLOY_HOST }}
      H4: ${{ secrets.EMPIRE_SERVER_HOST }}
      H5: ${{ secrets.SCALEWAY_HOST }}
      U1: ${{ secrets.SERVER_USER }}
      U2: ${{ secrets.SSH_USER }}
      U3: ${{ secrets.DEPLOY_USER }}
      U4: ${{ secrets.EMPIRE_SERVER_USER }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for n in S1 S2 S3 S4 S5 S6 H1 H2 H3 H4 H5 U1 U2 U3 U4; do
            if [ -n "${!n:-}" ]; then
              echo "$n=present"
            else
              echo "$n=absent"
            fi
          done
