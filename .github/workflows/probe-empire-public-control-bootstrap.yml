name: Probe Empire Public Control Bootstrap

on:
  push:
    branches:
      - probe/empire-public-control-bootstrap

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe public control surfaces
        shell: bash
        run: |
          set -u
          probe() {
            url="$1"
            echo "===== $url ====="
            curl -k -sS -D - -o /tmp/body --max-time 10 "$url" || true
            echo "--- body ---"
            head -c 2500 /tmp/body 2>/dev/null || true
            echo
          }
          for host in             empire-ai.co.uk             mcp.empire-ai.co.uk             ops.empire-ai.co.uk             webmcp.empire-ai.co.uk             control.empire-ai.co.uk             api.empire-ai.co.uk
          do
            echo "##### HOST $host #####"
            getent ahostsv4 "$host" | head -n 3 || true
            probe "https://$host/health"
            probe "https://$host/mcp"
          done
          probe "https://empire-ai.co.uk/agent-web/capabilities"
          probe "https://empire-ai.co.uk/v1/founder-directives/status"
          probe "https://empire-ai.co.uk/v1/ops-bridge/health"
