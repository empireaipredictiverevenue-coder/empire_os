name: Verify Empire Ops Bridge

on:
  push:
    branches:
      - probe/empire-public-control-bootstrap

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout current Empire engineering branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-cloud-wave4
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,outbound-email]"

      - name: Compile bridge modules
        run: |
          python -m py_compile \
            empire_os/hermes_control.py \
            empire_os/ops_github_bridge.py \
            empire_os/ops_bridge_api.py \
            empire_os/resend_webhook_app.py

      - name: Run bridge and reply regression tests
        run: |
          python -m pytest -q \
            tests/test_hermes_ops_bridge.py \
            tests/test_ops_github_bridge.py \
            tests/test_resend_webhook_app.py
