name: Verify Empire Mail suppression fix

on:
  push:
    branches:
      - fix/empire-mail-suppressions-provider

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,outbound-email]"
      - name: Prepare CI runtime
        run: |
          sudo mkdir -p /root/empire_os
          sudo touch /root/empire_os/.env
          sudo chmod 755 /root /root/empire_os
          sudo chmod 644 /root/empire_os/.env
      - name: Test
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_founder_mailbox_api.py \
            tests/test_empire_mailbox.py \
            tests/test_reply_classifier.py \
            --tb=short
      - name: Compile
        run: python -m py_compile empire_os/founder_mailbox_api.py
