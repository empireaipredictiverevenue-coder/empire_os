name: Probe Empire MCP DNS

on:
  push:
    branches:
      - probe/empire-public-control-bootstrap

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe DNS and HTTPS
        shell: bash
        run: |
          set +e
          echo "=== GETENT ==="
          getent ahostsv4 mcp.empire-ai.co.uk
          echo "=== PYTHON DNS ==="
          python -c 'import socket; print(socket.getaddrinfo("mcp.empire-ai.co.uk",443))'
          echo "=== CURL ==="
          curl -sS -D - -o /tmp/body --max-time 20 https://mcp.empire-ai.co.uk/mcp
          rc=$?
          echo "curl_rc=$rc"
          echo "--- body ---"
          head -c 2000 /tmp/body 2>/dev/null || true
          echo
          exit 0
