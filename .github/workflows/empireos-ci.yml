name: EmpireOS CI

on:
  pull_request:
    branches:
      - main
      - agent/data-cloud-wave4
  push:
    branches:
      - main
      - agent/data-cloud-wave4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empireos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile canonical Python
        run: |
          python -m compileall -q empire_os tests

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- '*.py' '*.toml' '*.yml' '*.yaml'; then
            echo "Unresolved merge marker detected"
            exit 1
          fi

      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Core truth and opportunity regressions
        run: |
          python -m pytest -q \
            tests/test_community_intent.py \
            tests/test_signal_resolver.py \
            tests/test_opportunity_radar.py \
            tests/test_opportunity_factory_intake.py \
            tests/test_linkedin_revenue_department.py \
            tests/test_linkedin_revenue_department_systemd.py \
            tests/test_predictive_cloud_status.py::test_status_exposes_linkedin_revenue_department_without_send_authority
