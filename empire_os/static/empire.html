<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Empire AI — Lead Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink: {
            950: '#03060a',
            900: '#070b12',
            850: '#0a0f1a',
            800: '#0e1422',
            700: '#161e30',
            600: '#1f2940',
            500: '#2a3552',
            400: '#3a4567',
          },
          neon: {
            green: '#39ff88',
            'green-dim': '#1eb85f',
            cyan: '#00e5ff',
            'cyan-dim': '#0099b3',
          },
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
        animation: {
          'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          'fade-in': 'fadeIn 600ms ease-out',
          'fade-up': 'fadeUp 600ms cubic-bezier(0.16, 1, 0.3, 1)',
          'constellation': 'constellation 60s linear infinite',
          'orbit': 'orbit 20s linear infinite',
          'glow': 'glow 2s ease-in-out infinite alternate',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          fadeUp: {
            '0%': { opacity: 0, transform: 'translateY(20px)' },
            '100%': { opacity: 1, transform: 'translateY(0)' },
          },
          constellation: {
            '0%': { transform: 'rotate(0deg) scale(1)' },
            '50%': { transform: 'rotate(180deg) scale(1.1)' },
            '100%': { transform: 'rotate(360deg) scale(1)' },
          },
          orbit: {
            '0%': { transform: 'rotate(0deg) translateX(120px) rotate(0deg)' },
            '100%': { transform: 'rotate(360deg) translateX(120px) rotate(-360deg)' },
          },
          glow: {
            '0%': { boxShadow: '0 0 20px rgba(57,255,136,0.3)' },
            '100%': { boxShadow: '0 0 40px rgba(57,255,136,0.6)' },
          },
        },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    html { font-family: 'Inter', system-ui, sans-serif; font-feature-settings: 'cv01','ss03'; }
    body { @apply bg-ink-950 text-slate-200 antialiased; }
    ::selection { background: rgba(57, 255, 136, 0.3); color: #fff; }
  }
  @layer components {
    .glass { backdrop-filter: blur(20px); background: rgba(14, 20, 34, 0.6); border: 1px solid rgba(255,255,255,0.08); }
    .glass-strong { backdrop-filter: blur(24px); background: rgba(14, 20, 34, 0.85); border: 1px solid rgba(255,255,255,0.1); }
    .neon-border { box-shadow: 0 0 0 1px rgba(57, 255, 136, 0.4), 0 0 30px rgba(57, 255, 136, 0.15); }
    .cyan-glow { box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.4), 0 0 30px rgba(0, 229, 255, 0.15); }
    .neon-text { text-shadow: 0 0 24px rgba(57, 255, 136, 0.5); }
    .cyan-text { text-shadow: 0 0 24px rgba(0, 229, 255, 0.5); }
    .gradient-text { @apply bg-gradient-to-r from-neon-green via-neon-cyan to-neon-green bg-clip-text text-transparent; }
    .btn{ @apply inline-flex items-center justify-center gap-2 rounded-lg font-medium text-[15px] leading-none transition-all duration-150 ease-out select-none; }
    .btn:active{ @apply translate-y-px; }
    .btn-primary{ @apply btn bg-neon-green text-ink-950 px-5 py-2.5 shadow-[0_1px_0_0_rgba(255,255,255,0.4)_inset,0_8px_20px_-6px_rgba(57,255,136,0.5),0_0_0_1px_rgba(57,255,136,0.3)] hover:bg-[#1eb85f] hover:shadow-[0_1px_0_0_rgba(255,255,255,0.4)_inset,0_12px_28px_-6px_rgba(57,255,136,0.6),0_0_0_1px_rgba(57,255,136,0.4)] hover:-translate-y-0.5; }
    .btn-secondary{ @apply btn bg-neon-cyan text-ink-950 px-5 py-2.5 shadow-[0_1px_0_0_rgba(255,255,255,0.4)_inset,0_8px_20px_-6px_rgba(0,229,255,0.5),0_0_0_1px_rgba(0,229,255,0.3)] hover:bg-[#0099b3] hover:shadow-[0_1px_0_0_rgba(255,255,255,0.4)_inset,0_12px_28px_-6px_rgba(0,229,255,0.6),0_0_0_1px_rgba(0,229,255,0.4)] hover:-translate-y-0.5; }
    .btn-dark{ @apply btn bg-white text-ink-950 px-5 py-2.5 shadow-[0_1px_0_0_rgba(255,255,255,0.1)_inset,0_8px_20px_-6px_rgba(0,0,0,0.5),0_0_0_1px_rgba(255,255,255,0.1)] hover:bg-slate-100 hover:shadow-[0_1px_0_0_rgba(255,255,255,0.1)_inset,0_12px_28px_-6px_rgba(0,0,0,0.6),0_0_0_1px_rgba(255,255,255,0.15)] hover:-translate-y-0.5; }
    .btn-ghost{ @apply btn bg-white/[0.04] text-slate-200 border border-white/10 px-5 py-2.5 backdrop-blur-sm hover:bg-white/[0.08] hover:border-white/20 hover:text-white; }
    .btn-outline{ @apply btn bg-transparent text-neon-green border border-neon-green/40 px-5 py-2.5 hover:bg-neon-green/10 hover:border-neon-green/70 hover:-translate-y-0.5 hover:shadow-[0_8px_20px_-6px_rgba(57,255,136,0.4)]; }
    .btn-link{ @apply btn bg-transparent text-neon-green px-2 py-1 hover:text-neon-cyan; }
    .btn-sm{ @apply px-3 py-1.5 text-[13px]; }
    .btn-lg{ @apply px-7 py-3.5 text-base; }
    .btn-xl{ @apply px-9 py-4 text-lg font-semibold; }
    .btn .arrow{ @apply transition-transform duration-200 group-hover:translate-x-1; }
    .btn-neon{ @apply btn-primary; }
    .btn-cyan{ @apply btn-secondary; }
    .card { @apply rounded-2xl glass p-6 transition-all duration-300; }
    .card-hover { @apply hover:border-neon-green/30 hover:-translate-y-1 hover:shadow-[0_8px_40px_rgba(57,255,136,0.1)]; }
    .pill { @apply inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium; }
    .stat-num { @apply text-4xl font-semibold tracking-tight tabular-nums; }
  }
  @layer utilities {
    .animate-in { animation: fadeUp 600ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .delay-1 { animation-delay: 100ms; }
    .delay-2 { animation-delay: 200ms; }
    .delay-3 { animation-delay: 300ms; }
    .delay-4 { animation-delay: 400ms; }
    .delay-5 { animation-delay: 500ms; }
    .text-balance { text-wrap: balance; }
    .grain { background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 4px 4px; }
  }
</style>
</head>

<template id="tpl-login">

    <div class="w-full max-w-md animate-fade-up">
      <button onclick="goto('splash')" class="btn btn-ghost btn-sm mb-8 group">

        <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-br from-neon-green to-neon-cyan flex items-center justify-center text-ink-950 font-bold text-xl animate-glow mb-4">✦</div>
        <h1 class="text-3xl font-bold tracking-tight text-white">Sign in to Empire</h1>
        <p class="mt-2 text-sm text-slate-400">Access your dashboard, leads, and vault.</p>
      </div>

      <div class="card">
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1.5">Email</label>

          <div class="text-xs text-slate-500">New to Empire?</div>
          <button onclick="applyBuyer()" class="mt-2 text-sm text-neon-cyan hover:text-neon-green transition font-medium">

</template>

<script>
// ===== live metrics =====
function _fmtUsd(cents){
  if(cents==null) return '$—';
  const v = cents/100;
  if(v>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
  if(v>=1e6) return '$'+(v/1e6).toFixed(2)+'M';
  if(v>=1e3) return '$'+(v/1e3).toFixed(1)+'K';
  return '$'+v.toFixed(0);
}
function _fmtInt(n){
  if(n==null) return '—';
  return Number(n).toLocaleString();
}
async function _loadLiveMetrics(){
  try {
    const [rev, leads, subs, vault] = await Promise.all([
      fetch('/v1/stats/revenue').then(r=>r.json()),
      fetch('/v1/stats/leads').then(r=>r.json()),
      fetch('/v1/stats/subs').then(r=>r.json()),
      fetch('/v1/stats/funnel').then(r=>r.json()),
      fetch('/v1/stats/vault').then(r=>r.json()),
    ]);
    const arr = (vault.arr_estimate_cents != null)
      ? vault.arr_estimate_cents
      : (rev.total_paid_charges_cents || 0);
    const mrrCents = (vault.monthly_paid_cents != null)
      ? vault.monthly_paid_cents
      : Math.round((rev.total_paid_charges_cents || 0) / 12);
    const subsCount = subs.unique_paid_subscriptions || subs.active || 0;
    const leadsCount = (leads.lane_leads && leads.lane_leads.total) || 0;
    const vaultCents = vault.lifetime_settled_cents || 0;
    const arrEl = document.getElementById('kpi-arr');
    const subsEl = document.getElementById('kpi-subs');
    const leadsEl = document.getElementById('kpi-leads');
    const vaultEl = document.getElementById('kpi-vault');
    if(arrEl)   arrEl.textContent   = _fmtUsd(arr);
    if(subsEl)  subsEl.textContent  = _fmtInt(subsCount);
    if(leadsEl) {
      leadsEl.textContent = leadsCount >= 1000
        ? (leadsCount/1000).toFixed(0)+'K'
        : leadsCount.toString();
    }
    if(vaultEl) vaultEl.textContent = _fmtUsd(vaultCents);
    // Inject "▲ MRR $X" subtitle beside the ARR card if present
    const arrCard = arrEl ? arrEl.closest('.card') : null;
    const mrrSub = arrCard ? arrCard.querySelector('.text-neon-green\\/70') : null;
    if (mrrSub) mrrSub.textContent = '▲ MRR ' + _fmtUsd(mrrCents);
    // Append awaits count under subs
    const subsCard = subsEl ? subsEl.closest('.card') : null;
    const subSub = subsCard ? subsCard.querySelector('.text-neon-cyan\\/70') : null;
    if (subSub && subs.awaiting_payment != null)
      subSub.textContent = subs.active+' total / '+subs.awaiting_payment+' awaiting';
    // Append real leads count under leads
    const leadsCard = leadsEl ? leadsEl.closest('.card') : null;
    const leadSub = leadsCard ? leadsCard.querySelector('.text-slate-500.mt-1\\.5') : null;
    if (leadSub && leadsCount) leadSub.textContent = leadsCount.toLocaleString()+' records';
  } catch (e) {
    console.warn('[empire] live metrics load failed:', e);
  }
}
_loadLiveMetrics();
setInterval(_loadLiveMetrics, 60000);
</script>

<script>
// =========================================================
// Constellation canvas background
// =========================================================
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  let W, H;
  function resize(){
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
    const n = Math.min(120, Math.floor(W*H/10000));
    stars = [];
    for(let i=0;i<n;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-0.5)*0.15, vy:(Math.random()-0.5)*0.15,
        r:Math.random()*1.5+0.5,
        hue: Math.random()<0.4 ? 142 : Math.random()<0.7 ? 187 : 320
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<0||s.x>W) s.vx*=-1;
      if(s.y<0||s.y>H) s.vy*=-1;
      const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
      g.addColorStop(0,`hsla(${s.hue},90%,75%,.9)`);
      g.addColorStop(1,`hsla(${s.hue},90%,75%,0)`);
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*4,0,Math.PI*2); ctx.fill();
    }
    // constellation links
    for(let i=0;i<stars.length;i++){
      for(let j=i+1;j<stars.length;j++){
        const a=stars[i], b=stars[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<140){
          ctx.strokeStyle=`hsla(${a.hue},80%,70%,${(1-d/140)*0.18})`;
          ctx.lineWidth=0.6;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  resize(); tick();
  window.addEventListener('resize', resize);
})();

        <td class="px-4 py-3 text-right"><span class="pill bg-neon-green/10 text-neon-green border border-neon-green/30">delivered</span></td>
      </tr>
    `).join('');
  }).catch(()=>{
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-sm text-slate-500 py-8 font-mono">live feed pending</td></tr>';
  });
}

// =========================================================
// Control Panel (start/stop/restart agent fleet)
// =========================================================
async function loadControl(){
  const tbody = document.getElementById('ctl-tbody');
  const stats = document.getElementById('ctl-stats');
  if(!tbody || !stats) return;
  stats.innerHTML = '<div class="text-center text-sm text-slate-500 py-8 col-span-full font-mono">loading fleet…</div>';
  tbody.innerHTML = '<tr><td colspan="5" class="text-center text-sm text-slate-500 py-8 font-mono">loading…</td></tr>';
  try {
    const r = await fetch('/v1/hermes/agents');
    const d = await r.json();
    const units = d.units || [];
    // Stats cards
    const active = units.filter(u => u.active === 'active').length;
    const inactive = units.filter(u => u.active === 'inactive').length;
    const failed = units.filter(u => u.active === 'failed').length;
    const other = units.length - active - inactive - failed;
    stats.innerHTML = `
      <div class="card"><div class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Total</div><div class="stat-num text-white mt-2">${units.length}</div></div>
      <div class="card"><div class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Active</div><div class="stat-num text-neon-green mt-2">${active}</div></div>
      <div class="card"><div class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Inactive</div><div class="stat-num text-slate-400 mt-2">${inactive}</div></div>
      <div class="card"><div class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Failed</div><div class="stat-num text-red-400 mt-2">${failed + other}</div></div>
    `;
    tbody.innerHTML = units.map(u => {
      const isRunning = u.active === 'active';
      const isDead = u.active === 'failed' || u.active === 'inactive';
      const dotColor = isRunning ? 'bg-neon-green' : isDead ? 'bg-red-400' : 'bg-yellow-400';
      const log = u.logs || '' ;
      const logShort = log.length > 0 ? log.split('\n').filter(Boolean).slice(-2).join(' · ').slice(0, 160) : '<span class="text-slate-600">(no recent log)</span>';
      return `<tr class="border-b border-white/5 hover:bg-white/[.02] transition">
        <td class="px-4 py-3 font-mono text-xs text-slate-200">${u.name}</td>
        <td class="px-4 py-3"><span class="flex items-center gap-1.5 text-[10px] font-mono uppercase tracking-wider ${isRunning?'text-neon-green':isDead?'text-red-400':'text-yellow-400'}"><span class="w-1.5 h-1.5 rounded-full ${dotColor} ${isRunning?'animate-pulse':''}"></span>${u.active}</span></td>
        <td class="px-4 py-3 text-[10px] font-mono text-slate-500">${u.state}</td>
        <td class="px-4 py-3 text-[10px] font-mono text-slate-500 max-w-md truncate" title="${(u.logs||'').replaceAll('"','&quot;')}">${logShort}</td>
        <td class="px-4 py-3 text-right">
          <div class="inline-flex gap-1.5">
            <button onclick="ctlAction('${u.name}','restart')" class="text-[10px] font-mono px-2 py-1 rounded border border-neon-green/40 text-neon-green hover:bg-neon-green/10 transition">restart</button>
            <button onclick="ctlAction('${u.name}','stop')" class="text-[10px] font-mono px-2 py-1 rounded border border-red-400/40 text-red-400 hover:bg-red-400/10 transition">stop</button>
            <button onclick="ctlAction('${u.name}','start')" class="text-[10px] font-mono px-2 py-1 rounded border border-neon-cyan/40 text-neon-cyan hover:bg-neon-cyan/10 transition">start</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-sm text-red-400 py-8 font-mono">failed to load: ${e.message}</td></tr>`;
  }
}

async function ctlAction(name, action){
  if(action === 'restart' && !confirm(`Restart ${name}?`)) return;
  if(action === 'stop' && !confirm(`Stop ${name}? Brief service outage possible.`)) return;
  if(action === 'start' && !confirm(`Start ${name}?`)) return;
  try {
    const r = await fetch('/v1/hermes/agent/action', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, action })
    });
    const d = await r.json();
    if(d.ok) {
      setTimeout(loadControl, 1200);
    } else {
      alert('Action failed: ' + (d.stderr || d.error || JSON.stringify(d)));
    }
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

// =========================================================
// Support (chat → /v1/hermes/chat)
// =========================================================
async function supAsk(text){
  if(!text || !text.trim()) return;
  const log = document.getElementById('sup-log');
  if(log){
    const userBubble = document.createElement('div');
    userBubble.className = 'bg-neon-green/10 border border-neon-green/30 rounded-2xl rounded-tr-sm p-4 max-w-2xl ml-auto text-sm text-white';
    userBubble.textContent = text;
    log.appendChild(userBubble);
    log.scrollTop = log.scrollHeight;
  }
  const input = document.getElementById('sup-input');
  if(input) input.value = '';
  const placeholderId = 'sup-ph-' + Date.now();
  if(log){
    const ph = document.createElement('div');
    ph.id = placeholderId;
    ph.className = 'bg-ink-900/40 rounded-2xl rounded-tl-sm p-4 max-w-2xl text-sm text-slate-400';
    ph.textContent = '…thinking';
    log.appendChild(ph);
    log.scrollTop = log.scrollHeight;
  }
  try {
    const r = await fetch('/v1/hermes/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text })
    });
    const d = await r.json();
    const ans = d.answer || d.error || 'no answer';
    const el = document.getElementById(placeholderId);
    if(el){
      el.className = 'bg-ink-900/40 rounded-2xl rounded-tl-sm p-4 max-w-2xl text-sm text-slate-200';
      el.textContent = ans;
    }
  } catch (e) {
    const el = document.getElementById(placeholderId);
    if(el){ el.textContent = 'Network error: ' + e.message; }
  }
}

function loadSupport(){
  const form = document.getElementById('sup-form');
  if(form && !form.dataset.wired){
    form.dataset.wired = '1';
    form.addEventListener('submit', e => {
      e.preventDefault();
      const v = document.getElementById('sup-input').value;
      supAsk(v);
    });
  }
}

// =========================================================
// White-label editor
// =========================================================
function loadWhitelabel(){
  fetch('/v1/hermes/whitelabel').then(r=>r.json()).then(d=>{
    if(!d || !d.ok) return;
    document.getElementById('wl-name').value     = d.brand_name || '';
    document.getElementById('wl-accent').value    = d.accent || '#39ff88';
    document.getElementById('wl-accent-pick').value = d.accent || '#39ff88';
    document.getElementById('wl-logo').value      = d.logo || '';
    document.getElementById('wl-tagline').value   = d.tagline || '';
    wlpv();
  });
  const accent = document.getElementById('wl-accent');
  const pick   = document.getElementById('wl-accent-pick');
  if(accent && pick && !accent.dataset.wired){
    accent.dataset.wired = '1';
    accent.addEventListener('input', () => { pick.value = accent.value; wlpv(); });
    pick.dataset.wired = '1';
    pick.addEventListener('input', () => { accent.value = pick.value; wlpv(); });
  }
  const form = document.getElementById('wl-form');
  if(form && !form.dataset.wired){
    form.dataset.wired = '1';
    form.addEventListener('submit', e => {
      e.preventDefault();
      const body = {
        brand_name: document.getElementById('wl-name').value,
        accent:     document.getElementById('wl-accent').value,
        logo:       document.getElementById('wl-logo').value,
        tagline:    document.getElementById('wl-tagline').value,
      };
      const status = document.getElementById('wl-status');
      fetch('/v1/hermes/whitelabel', {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      }).then(r=>r.json()).then(d=>{
        if(status){
          status.textContent = d.ok ? '✓ saved' : '✗ failed';
          setTimeout(()=>status.textContent='', 3000);
        }
        if(d.ok) wlpv();
      });
    });
  }
}
function wlpv(){
  const n = document.getElementById('wl-name').value || 'Empire AI';
  const t = document.getElementById('wl-tagline').value || 'Empire AI — Lead Constellation';
  const l = document.getElementById('wl-logo').value;
  const a = document.getElementById('wl-accent').value || '#39ff88';
  const pn = document.getElementById('wl-pv-name'); if(pn) pn.textContent = n;
  const pt = document.getElementById('wl-pv-tag');  if(pt) pt.textContent = t;
  const pl = document.getElementById('wl-logo-img');
  if(pl){
    if(l){
      pl.innerHTML = `<img src="${l}" class="w-10 h-10 rounded-lg object-cover" onerror="this.style.display='none'">`;
    } else {
      pl.textContent = '+';
      pl.style.background = `linear-gradient(135deg, ${a}, #00e5ff)`;
    }
  }
}

async function runCloser(){
  const limit = parseInt(document.getElementById('closer-limit')?.value || '10');
  const result = document.getElementById('closer-result');
  if(result) result.textContent = 'running…';
  try {
    const r = await fetch('/v1/closer/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ limit })
    });
    const d = await r.json();
    if(result) result.textContent = d.ok ? JSON.stringify(d, null, 2) : (d.error || JSON.stringify(d));
  } catch(e) {
    if(result) result.textContent = 'error: ' + e.message;
  }
}
