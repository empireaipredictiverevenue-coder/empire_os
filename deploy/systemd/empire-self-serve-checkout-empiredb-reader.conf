[Service]
# Canonical EmpireDB provider, already used by the working product-catalog timer.
EnvironmentFile=/etc/empiredb.env
# A first-party enquiry is not authority to bind a fulfilment order or move USDT.
Environment=EMPIRE_SELF_SERVE_BINDING_ORDERS_AUTHORIZED=OFF
Environment=EMPIRE_SELF_SERVE_PAYMENT_PROPOSAL_AUTHORIZED=OFF
