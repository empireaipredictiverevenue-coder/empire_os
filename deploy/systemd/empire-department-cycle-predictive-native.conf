[Service]
# Founder-approved existing observer activation, with separate restricted identities.
# systemd maintains a private read-only per-service mount; original vault stays root-only.
LoadCredential=predictive-revenue-reader:/etc/empire/revenue-event-evidence/reader.pgpass
Environment=EMPIRE_PREDICTIVE_NATIVE_SOURCE_ENABLED=1
LoadCredential=predictive-revenue-writer:/etc/empire/predictive-native-writer/writer.pgpass
Environment=EMPIRE_PREDICTIVE_NATIVE_REGISTRATION_ENABLED=1
# Existing MediaOS references -> original JEV research review, same observer hook.
# Operator research scope is not verified publisher/customer geography.
Environment=EMPIRE_PREDICTIVE_NEWSJACK_RESEARCH_ENABLED=1
Environment=EMPIRE_PREDICTIVE_NEWSJACK_RESEARCH_SECTOR=ai
Environment=EMPIRE_PREDICTIVE_NEWSJACK_RESEARCH_MARKET=GB
